<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="הקלדתם בשפה הלא נכונה? הדביקו את הטקסט וקבלו אותו מתוקן."
      data-i18n-content="tagline"
    />
    <title>Keyboard Language Fixer</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./src/ui/styles.css" />
  </head>
  <body>
    <!--
      The Hebrew texts below are the defaults shown before the script runs.
      Elements marked with data-i18n are re-filled from src/ui/i18n.js.
    -->
    <main class="app">
      <header class="app-header">
        <div>
          <h1 data-i18n="title">מתקן שפת מקלדת</h1>
          <p class="tagline" data-i18n="tagline">
            הקלדתם בשפה הלא נכונה? הדביקו את הטקסט וקבלו אותו מתוקן.
          </p>
        </div>
        <button
          id="language-button"
          type="button"
          class="button button-secondary button-small"
          data-i18n="switchLanguage"
          lang="en"
        >
          English
        </button>
      </header>

      <section class="panel">
        <label class="panel-label" for="input-text" data-i18n="inputLabel">הטקסט שלך</label>
        <textarea
          id="input-text"
          dir="auto"
          rows="6"
          spellcheck="false"
          autofocus
          placeholder="הדביקו או הקלידו כאן, למשל: akuo"
          data-i18n-placeholder="inputPlaceholder"
        ></textarea>
        <div class="panel-actions panel-actions-end">
          <button
            id="clear-button"
            type="button"
            class="button button-secondary"
            data-i18n="clear"
          >
            נקה
          </button>
        </div>
      </section>

      <p id="status" class="status" role="status" aria-live="polite"></p>

      <section class="panel">
        <label class="panel-label" for="output-text" data-i18n="outputLabel">
          הטקסט המתוקן
        </label>
        <textarea id="output-text" dir="auto" rows="6" readonly></textarea>
        <div class="panel-actions">
          <div class="manual-actions">
            <span class="manual-hint" data-i18n="manualHint">הזיהוי טעה?</span>
            <button
              id="to-hebrew-button"
              type="button"
              class="button button-secondary button-small"
              data-i18n="toHebrew"
              aria-pressed="false"
              disabled
            >
              המר לעברית
            </button>
            <button
              id="to-english-button"
              type="button"
              class="button button-secondary button-small"
              data-i18n="toEnglish"
              aria-pressed="false"
              disabled
            >
              המר לאנגלית
            </button>
            <button
              id="original-button"
              type="button"
              class="button button-secondary button-small"
              data-i18n="showOriginal"
              aria-pressed="false"
              disabled
            >
              החזר מקור
            </button>
          </div>
          <button
            id="copy-button"
            type="button"
            class="button button-primary"
            data-i18n="copy"
            disabled
          >
            העתק
          </button>
          <!-- Announces a successful copy to screen readers. -->
          <span id="copy-announcement" class="visually-hidden" role="status"></span>
        </div>
      </section>

      <footer class="app-footer" data-i18n="footer">
        הטקסט מעובד בדפדפן שלך בלבד ואינו נשלח לשום מקום.
      </footer>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
